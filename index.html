<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    
    <div class="game-container">
        <div class="title-container">
            <h1>ROCK · PAPER · <span class="title-scissors-span">SCISSORS</span></h1>
            <p class="emoji-title">✊ ✋ ✌️</p>
            <p class="winner-p">The winner is first to 5 points</p>
        </div>

        <div class="gameplay-container">
                <div class="gameplay-title-container">
                    <h1>PLAY VS <span class="gameplay-title-span">COMPUTER</span></h1>
                </div>

                <div class="counter-container">
                    <div class="you-box">
                        <span>YOU</span>
                        <span class="user-counter">0</span>
                    </div>
                    <div class="vs-box">
                        <span>VS</span>
                        <span class="draws-counter">0</span>
                    </div>
                    <div class="cpu-box">
                        <span>CPU</span>
                        <span class="cpu-counter">0</span>
                    </div>
                </div>

                <div class="move-container">
                    <div class="title-wrapper"><h3 class="title">Make your move to Throw</h3></div>

                    <div class="game-display-wrapper">
                        <div class="you-move-box">
                            <div class="chosen-move-box"><span id="you-move">✊</span></div>
                            <span class="subtitle-span">YOU</span>
                        </div>

                        <div class="game-dislay-vs-box">
                            <span>vs</span>
                        </div>

                        <div class="cpu-move-box">
                            <div class="chosen-move-box"><span id="cpu-move">✊</span></div>
                            <span class="subtitle-span">CPU</span>
                        </div>
                    </div>
                </div>

                <div class="button-wrapper">
                    <button value="Rock" class="move-button"><span>✊</span><span>ROCK</span></button>
                    <button value="Paper" class="move-button"><span>✋</span><span>PAPER</span></button>
                    <button value="Scissors" class="move-button"><span>✌️</span><span>SCISSORS</span></button>
                </div>

                <div class="command-container">
                    <p>Tip: press <span>R</span><span>P</span><span>S</span> to throw.</p>
                    <button class="reset-button">
                        <span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-rotate-ccw size-4" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg></span>
                        <span>RESET</span>
                    </button>
                </div>
        </div>
    </div>

    <div class="footer">
            <p>Copyright © <a href="https://github.com/Saimon-p/Odin-Rock-Paper-Scissors">Saimon-p</a> 2026</p>
        </div>
    <script src="RPS.js?v=3"></script>
</body>
</html>
